services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile.prod
    container_name: ceevizor-backend
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile.prod
    container_name: ceevizor-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
